spring:
  application:
    name: devpulse

  datasource:
    url: jdbc:postgresql://localhost:5432/devpulse
    username: devpulse
    password: devpulse

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: read:user,repo

management:
  endpoints:
    web:
      exposure:
        include: health,info
